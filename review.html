<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Ôn Tập Bài Học - Easy English</title>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">

    <!-- 3D Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Main Review Container -->
    <main class="glass-panel w-full max-w-xl p-6 sm:p-8 rounded-3xl relative z-10 mx-auto">

        <!-- Top Navigation -->
        <div class="flex items-center justify-between mb-6">
            <a href="index.html"
                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/80 hover:bg-white text-indigo-600 font-semibold text-sm shadow-sm transition-all duration-200 hover:-translate-x-0.5 border border-indigo-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Quay lại</span>
            </a>

            <div id="statusBadge"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200 shadow-sm">
                <span>🌟 Đã học 30 phút</span>
            </div>
        </div>

        <!-- Lesson Header -->
        <header class="text-center mb-6">
            <div
                class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 font-bold text-xs rounded-full uppercase tracking-wider mb-2">
                Bài học ngày
            </div>
            <h1 id="lessonDateDisplay" class="text-3xl font-extrabold text-gray-800 tracking-tight"
                style="font-family: 'Poppins', sans-serif;">
                --/--/----
            </h1>
            <p class="text-gray-500 text-xs mt-1">Xem lại kiến thức và từ vựng bạn đã ghi chú</p>
        </header>

        <!-- Lesson Note Card -->
        <section class="bg-white rounded-2xl p-6 border border-gray-100 shadow-md mb-6">

            <!-- Actions Toolbar -->
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-gray-100 flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <button id="copyBtn"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-xs rounded-lg transition-colors"
                        title="Sao chép nội dung ghi chú">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3">
                            </path>
                        </svg>
                        <span id="copyBtnText">Sao chép ghi chú</span>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <div id="readOnlyBadge"
                        class="hidden inline-flex items-center gap-1 px-2.5 py-1 bg-gray-100 text-gray-500 font-medium text-xs rounded-lg border border-gray-200">
                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                        <span>Chỉ xem ôn tập</span>
                    </div>

                    <button id="toggleEditBtn"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-xs rounded-lg transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                            </path>
                        </svg>
                        <span>Sửa ghi chú</span>
                    </button>
                </div>
            </div>

            <!-- View Mode: Formatted Note Content -->
            <div id="noteViewContainer">
                <div id="noteContent"
                    class="text-gray-700 text-sm sm:text-base leading-relaxed whitespace-pre-wrap font-normal break-words min-h-[220px]">
                    Đang tải ghi chú...
                </div>
            </div>

            <!-- Edit Mode (Hidden by default) -->
            <div id="noteEditContainer" class="hidden">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Soạn thảo ghi chú bài
                        học</span>
                    <span id="reviewWordCounter"
                        class="text-xs font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">0 từ • 0 ký
                        tự</span>
                </div>

                <!-- Word Editor Toolbar -->
                <div id="reviewEditorToolbar"></div>

                <textarea id="editNoteTextarea" rows="12"
                    class="w-full min-h-[280px] max-h-[65vh] border border-gray-300 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y leading-relaxed"
                    placeholder="Nhập ghi chú bài học..."></textarea>

                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancelEditBtn"
                        class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Hủy</button>
                    <button id="saveEditBtn"
                        class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-md">Lưu
                        thay đổi</button>
                </div>
            </div>
        </section>

        <!-- Lesson Navigation (Prev / Next Lesson with Note) -->
        <div class="flex items-center justify-between gap-4 mb-6">
            <button id="prevLessonBtn"
                class="flex-1 px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold text-xs sm:text-sm rounded-xl transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-1">
                ← Bài trước
            </button>
            <button id="nextLessonBtn"
                class="flex-1 px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold text-xs sm:text-sm rounded-xl transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-1">
                Bài tiếp theo →
            </button>
        </div>

        <!-- Footer -->
        <footer
            class="mt-8 text-center text-xs text-gray-600 flex flex-col items-center gap-2 pt-6 border-t border-gray-200">
            <p class="text-sm font-semibold text-gray-700" style="font-family: 'Poppins', sans-serif;">Easy English,
                learn English with ease!</p>
            <!-- <a href="mailto:easyenglish.mrhai@gmail.com"
                class="flex items-center gap-1.5 text-xs text-indigo-600 hover:text-indigo-700 transition-colors">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                </svg>
                <span>easyenglish.mrhai@gmail.com</span>
            </a> -->
        </footer>
    </main>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/review.js"></script>
</body>

</html>
